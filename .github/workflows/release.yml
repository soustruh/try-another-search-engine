name: Check and publish Firefox add-on

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    firefox:
        name: 🦊 check Firefox add-on
        runs-on: ubuntu-latest
        steps:
            - name: 🚚 get release source
              uses: actions/checkout@v7
            - name: 🟢 set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
            - name: 📦 install dependencies
              run: npm ci
            - name: 🎨 check formatting
              run: npm run check
            - name: 🔎 validate Firefox add-on
              run: npm run lint:firefox
            - name: 🚀 submit to Firefox Add-ons
              if: github.event_name == 'push' && github.ref_type == 'tag'
              run: npm run sign:firefox -- --amo-metadata=.github/amo-metadata.json
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
                  WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
                  WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
                  WEB_EXT_APPROVAL_TIMEOUT: "0"
